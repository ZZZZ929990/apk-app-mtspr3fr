<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>סטודיו יצירה — האפליקציה שלי</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;background:linear-gradient(160deg,#6d5efc,#22d3ee);
    color:#fff;font-family:system-ui,sans-serif;padding:16px 12px 40px}
  h1{font-size:20px;margin:6px 0 14px;text-align:center}
  .card{background:#ffffff14;border:1px solid #ffffff22;border-radius:18px;padding:14px;margin:0 auto 14px;max-width:520px}
  label{display:block;font-size:12px;opacity:.85;margin:8px 0 4px}
  input,select{width:100%;padding:9px;border-radius:12px;border:1px solid #ffffff33;background:#0003;color:#fff;font:inherit}
  .row{display:flex;gap:8px}.row>*{flex:1}
  button{font:inherit;border:0;border-radius:14px;padding:10px 14px;background:#ffffff22;color:#fff}
  button.p{background:#ffffff33;font-weight:700}
  #tools{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
  #tools button.on{outline:2px solid #fff}
  #grid{display:grid;gap:2px;background:#0004;padding:6px;border-radius:14px;touch-action:none;user-select:none;margin:0 auto}
  .c{aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:#ffffff10;border-radius:5px;font-size:min(5vw,18px)}
  .list a{display:flex;justify-content:space-between;align-items:center;background:#ffffff10;border-radius:12px;
    padding:10px 12px;margin-top:8px;color:#fff;text-decoration:none}
  .back{display:block;text-align:center;color:#fff;opacity:.85;font-size:13px;margin-top:16px}
</style></head><body>
<h1>🎨 סטודיו יצירה</h1>

<div class="card">
  <div class="row">
    <div><label>שם המשחק</label><input id="title" value="המשחק שלי" /></div>
    <div style="max-width:80px"><label>סמל</label><input id="emoji" value="🕹️" /></div>
  </div>
  <div class="row">
    <div><label>רוחב</label><input id="cols" type="number" min="4" max="16" value="10" /></div>
    <div><label>גובה</label><input id="rows" type="number" min="4" max="18" value="12" /></div>
  </div>
  <div class="row">
    <div><label>מטרה</label><select id="goal">
      <option value="coins">לאסוף את כל המטבעות</option>
      <option value="reach">להגיע ליעד</option>
      <option value="survive">לשרוד עד סוף הזמן</option>
    </select></div>
    <div><label>חיים</label><input id="lives" type="number" min="1" max="9" value="3" /></div>
  </div>
  <div class="row">
    <div><label>זמן (שניות, 0 = ללא)</label><input id="time" type="number" min="0" max="600" value="0" /></div>
    <div><label>מהירות אויבים</label><input id="speed" type="number" min="1" max="5" value="3" /></div>
  </div>
  <div id="tools"></div>
  <div id="grid"></div>
  <div class="row" style="margin-top:12px">
    <button id="clear">ניקוי לוח</button>
    <button class="p" id="save">שמירה ומשחק</button>
  </div>
</div>

<div class="card">
  <b style="font-size:14px">המשחקים שיצרתי</b>
  <div class="list" id="list"></div>
</div>
<a class="back" href="index.html">← חזרה למסך הבית</a>

<script>
var TOOLS=[{v:0,e:'⬜',n:'מחק'},{v:1,e:'🧱',n:'קיר'},{v:2,e:'🪙',n:'מטבע'},{v:3,e:'👾',n:'אויב'},{v:4,e:'🚪',n:'יעד'},{v:5,e:'🙂',n:'שחקן'}];
var tool=1,cols=10,rows=12,grid=[],cells=[];
var $=function(i){return document.getElementById(i)};
TOOLS.forEach(function(t,i){var b=document.createElement('button');b.textContent=t.e+' '+t.n;
  if(t.v===1)b.className='on';
  b.onclick=function(){tool=t.v;[].forEach.call($('tools').children,function(x){x.className=''});b.className='on';};
  $('tools').appendChild(b);});
function build(){
  cols=Math.max(4,Math.min(16,+$('cols').value||10));
  rows=Math.max(4,Math.min(18,+$('rows').value||12));
  var old=grid.slice(),oc=cells.oc||cols;
  grid=new Array(cols*rows).fill(0);
  if(old.length){for(var y=0;y<rows;y++)for(var x=0;x<cols;x++){var v=old[y*oc+x];if(v!==undefined)grid[y*cols+x]=v;}}
  else{grid[0]=5;grid[cols*rows-1]=4;}
  var g=$('grid');g.innerHTML='';cells=[];cells.oc=cols;
  g.style.gridTemplateColumns='repeat('+cols+',minmax(0,1fr))';
  g.style.width='min(92vw,'+(cols*34)+'px)';
  for(var i=0;i<cols*rows;i++){(function(i){
    var d=document.createElement('div');d.className='c';
    var put=function(){if(tool===5){var p=grid.indexOf(5);if(p>-1){grid[p]=0;cells[p].textContent='';}}
      grid[i]=tool;d.textContent=TOOLS[tool].v===0?'':TOOLS[tool].e;};
    d.onpointerdown=put;d.onpointerenter=function(e){if(e.buttons)put();};
    g.appendChild(d);cells.push(d);})(i);}
  draw();
}
function draw(){for(var i=0;i<grid.length;i++){var t=TOOLS.filter(function(x){return x.v===grid[i]})[0];
  cells[i].textContent=grid[i]?t.e:'';}}
$('cols').onchange=build;$('rows').onchange=build;
$('clear').onclick=function(){grid=new Array(cols*rows).fill(0);draw();};

function load(){try{return JSON.parse(localStorage.getItem('myGames')||'[]')}catch(e){return[]}}
function save(a){localStorage.setItem('myGames',JSON.stringify(a));}
function render(){
  var l=$('list');l.innerHTML='';var a=load();
  if(!a.length){l.innerHTML='<p style="opacity:.7;font-size:13px">עוד לא יצרת משחקים.</p>';return;}
  a.forEach(function(g,i){
    var row=document.createElement('a');row.href='play.html?g='+i;
    row.innerHTML='<span>'+g.emoji+' '+g.title+'</span>';
    var del=document.createElement('button');del.textContent='מחק';
    del.onclick=function(e){e.preventDefault();var b=load();b.splice(i,1);save(b);render();};
    row.appendChild(del);l.appendChild(row);});
}
$('save').onclick=function(){
  var a=load();
  a.push({title:$('title').value||'המשחק שלי',emoji:$('emoji').value||'🕹️',cols:cols,rows:rows,
    grid:grid.slice(),goal:$('goal').value,time:+$('time').value||0,speed:+$('speed').value||3,lives:+$('lives').value||3});
  save(a);location.href='play.html?g='+(a.length-1);
};
build();render();
</script>
</body></html>
