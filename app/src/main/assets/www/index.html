<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>האפליקציה שלי</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;background:linear-gradient(160deg,#6d5efc,#22d3ee);
    color:#fff;font-family:system-ui,sans-serif;padding:22px 16px 40px;text-align:center}
  h1{font-size:24px;margin:14px 0 4px}
  p.sub{margin:0 0 22px;opacity:.85;font-size:13px}
  .logo{width:82px;height:82px;border-radius:22px;background:#ffffff1a;display:flex;align-items:center;
    justify-content:center;font-size:40px;margin:0 auto;box-shadow:0 10px 30px #0005}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:520px;margin:0 auto}
  a.tile{display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;
    background:#ffffff14;border:1px solid #ffffff22;border-radius:18px;padding:20px 10px;color:#fff;
    text-decoration:none;font-size:14px;font-weight:600}
  a.tile span{font-size:28px}
  .empty{opacity:.8;font-size:14px}
  footer{margin-top:28px;font-size:12px;opacity:.65}
</style></head><body>
<div class="logo">📱</div>
<h1>האפליקציה שלי</h1>
<p class="sub">גרסה 1.0.0 · עובדת גם בלי אינטרנט</p>
<div class="grid">
  <a class="tile" href="studio.html"><span>🎨</span>סטודיו יצירה</a>
  <p class="empty">הוסף כפתורים ומשחקים במחולל כדי שיופיעו כאן.</p>
</div>
<footer>com.example.myapp</footer>
</body></html>
